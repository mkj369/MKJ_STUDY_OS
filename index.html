<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0f5132" />
    <meta
      name="description"
      content="MKJ StudyOS — personal academic memory, syllabus tracker, revision manager and study planner for HSC Science."
    />
    <title>MKJ StudyOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('mkj.studyos.v1.theme');
        var dark =
          t === 'dark' ||
          ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (dark) document.documentElement.classList.add('ion-palette-dark');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
